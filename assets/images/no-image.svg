<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="8 8"/>

  <g transform="translate(400, 260)">
    <!-- Photo icon outline -->
    <rect x="-70" y="-55" width="140" height="110" rx="14" fill="none" stroke="url(#iconGrad)" stroke-width="5"/>
    <!-- Sun / Lens -->
    <circle cx="28" cy="-22" r="14" fill="none" stroke="url(#iconGrad)" stroke-width="4"/>
    <!-- Mountains -->
    <path d="M-68 35 L-25 -15 L15 25 L35 5 L68 35" fill="none" stroke="url(#iconGrad)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- Brand badge -->
  <text x="400" y="375" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#d97706">
    PNMEC GROUP
  </text>

  <!-- Placeholder label -->
  <text x="400" y="415" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#475569">
    Chưa có hình ảnh
  </text>
  <text x="400" y="445" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#94a3b8">
    Hình ảnh đang được cập nhật
  </text>
</svg>
